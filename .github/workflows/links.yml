# Checks every link in the catalog weekly and files (or updates) an issue
# labeled "broken-links" when something is definitely broken.
name: Check links

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The checker uses only Node built-ins, so no npm install is needed.
      - name: Check links
        id: check
        continue-on-error: true
        run: node scripts/check-links.mjs --report=link-report.md

      - name: Open or update the broken-links issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create broken-links --color d73a4a --description "Links that need fixing" 2>/dev/null || true
          issue=$(gh issue list --label broken-links --state open --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file link-report.md
          else
            gh issue create --title "Broken links found by the weekly check" --label broken-links --body-file link-report.md
          fi

      - name: Fail when links are broken
        if: steps.check.outcome == 'failure'
        run: exit 1
