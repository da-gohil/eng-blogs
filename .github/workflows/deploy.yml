# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment halfway; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Build and prerender
        run: npm run build
        env:
          # Absolute URL of the published site (handles project pages and custom domains).
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Powers the "Suggest a resource" and "Source on GitHub" links.
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
