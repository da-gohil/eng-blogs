<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engineering Blogs — Read what the best engineers are writing</title>
    <meta
      name="description"
      content="A curated, link-checked directory of {{resourceCount}} engineering blogs and learning resources: Alex Xu's System Design Interview series, big-tech engineering blogs, classic papers, free courses, and {{pathCount}} learning paths."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Engineering Blogs" />
    <meta property="og:title" content="Engineering Blogs — Read what the best engineers are writing" />
    <meta
      property="og:description"
      content="{{resourceCount}} hand-picked engineering blogs, system design resources, papers, and courses — plus step-by-step learning paths."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!--site-meta-->
    <script>
      // Runs before first paint: apply a saved theme, and hide deep links
      // (?view=…, ?q=…) until React renders them — see .deeplink in global.css.
      (function () {
        try {
          var theme = localStorage.getItem("engblogs:theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
            var color = theme === "dark" ? "#0b0b0f" : "#f7f7f9";
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
              meta.setAttribute("content", color);
            });
          }
        } catch (error) {}
        if (/[?&](view|q|cat|type|topic|sort|path)=/.test(location.search)) {
          document.documentElement.classList.add("deeplink");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript>
      <p style="text-align: center; padding: 16px; font: 14px system-ui, sans-serif">
        Search, filters, bookmarks, and learning-path progress need JavaScript. The links above still work without it.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
